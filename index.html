<!DOCTYPE html>

<head>

<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-8 offset-2">
                <form id="postData">
                    <div class="card">
                        <div class="card-header">
                            <label for="title">Title</label>
                            <input type="text" class="form-control" id="title">
                        </div>
                        <div class="card-body">
                            <label for="content">Content</label>
                            <textarea name="content" id="content" row="5" class="form-control"></textarea>

                            <label for="userId">User Id</label>
                            <select name="userId" class="form-control" id="userId">
                                <option value='1'>1</option>
                                <option value='2'>2</option>
                                <option value='3'>3</option>
                                <option value='4'>4</option>
                                <option value='5'>5</option>
                                <option value='6'>6</option>
                                <option value='7'>7</option>
                                <option value='8'>8</option>
                                <option value='9'>9</option>
                                <option value='10'>10</option>
                            </select>
                        </div>
                        <div class="card-footer">
                            <button type="submit" class="btn btn-primary" id="addPostBtn">Add Post</button>
                            <button type="button" class="btn btn-primary d-none" id="updateBtn">Update</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="container-fluid mt-4">
        <div class="row" id="PostContainer">
